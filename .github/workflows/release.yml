name: Build/release Electron app

on:
  push:
    tags:
      - v*.*.*

jobs:
  release:
    runs-on: ${{ matrix.os }}

    permissions:
      # Required for `npm run publish` to create the release and upload assets.
      contents: write

    strategy:
      # A failure on one platform must not cancel the other. This is what hid a
      # Linux-only packaging failure behind two cancelled jobs.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # 20 matches what the project is built and tested against locally;
          # 18 also worked for Forge but is past end-of-life.
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: desktop

      - name: Download ffmpeg
        run: npm run download-ffmpeg
        working-directory: desktop

      - name: Publish app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish
        working-directory: desktop
